[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"
[project]
name = "tokenscope"
version = "0.1.0"
description = "Local-first usage observability for coding agents and LLM APIs"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8"]
[project.scripts]
tokenscope = "cli.main:main"
[tool.setuptools.packages.find]
include = ["backend*", "cli*"]
[tool.setuptools.package-data]
backend = ["pricing/*.json", "static/**/*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
